run_name: small_cnn
seed: 0

data:
  root: data
  train_manifest: splits/train.csv
  val_manifest: splits/val.csv
  image_size: 128
  channels: 3
  color_mode: rgb
  transform: basic_augmentation
  batch_size: 64
  num_workers: 2

model:
  name: small_cnn
  pretrained: false
  dropout: 0.35

training:
  epochs: 50
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.0
  early_stopping_patience: 10
  freeze_backbone_epochs: 0
  amp: true
