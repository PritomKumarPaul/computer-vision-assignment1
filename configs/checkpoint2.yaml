run_name: checkpoint2
seed: 0

data:
  root: data
  train_manifest: splits/train.csv
  val_manifest: splits/val.csv
  image_size: 128
  channels: 3
  color_mode: rgb
  transform: resnet_regularized
  batch_size: 64
  num_workers: 2

model:
  name: resnet18_scratch
  pretrained: false
  dropout: 0.3

training:
  epochs: 50
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.1
  early_stopping_patience: 10
  amp: true
